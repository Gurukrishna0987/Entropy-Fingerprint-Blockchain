name: Fetch Aurora hero video

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested branch
        uses: actions/checkout@v4

      - name: Download the supplied hero video
        run: |
          mkdir -p public
          curl --fail --location --retry 3 \
            'https://pub-1e5b4001b36b47e28e6a2fb775966a79.r2.dev/templates/aurora/hero.mp4' \
            --output public/hero.mp4
          test -s public/hero.mp4

      - name: Commit the downloaded asset
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/hero.mp4
          git commit -m 'chore: add Aurora hero video'
          git push origin "HEAD:${BRANCH_NAME}"
